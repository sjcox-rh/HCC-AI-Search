# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build V2 (main)
      - name: Build V2
        run: npm run build
        env:
          ASSET_PATH: /HCC-AI-Search/

      # Checkout V1 branch and build it into dist/v1
      - name: Checkout V1 source
        uses: actions/checkout@v4
        with:
          ref: v1
          path: v1-source

      - name: Install V1 dependencies
        run: cd v1-source && npm ci --legacy-peer-deps

      - name: Build V1
        run: |
          cd v1-source && npm run build
          sed -i 's|<base href="/">|<base href="/HCC-AI-Search/v1/">|' dist/index.html
          sed -i 's|pathSegmentsToKeep = 1|pathSegmentsToKeep = 2|' dist/404.html
        env:
          ASSET_PATH: /HCC-AI-Search/v1/

      - name: Copy V1 into V2 dist
        run: cp -r v1-source/dist dist/v1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist directory (contains both V2 at root and V1 at /v1)
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
